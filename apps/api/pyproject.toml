[project]
name = "moneymatch-api"
version = "0.0.0"
description = "MoneyMatch API — server-authoritative skill-wagering backend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "greenlet>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.9",
    "sentry-sdk[fastapi]>=2.16",
    "posthog>=7.26.0",
    "pywebpush>=2.0.0",
    # Specialist numerics for bar-setting: Student-t predictive quantiles,
    # beta-binomial and negative-binomial models, and Wilson intervals on the
    # calibration curve.
    #
    # A real runtime dependency, not a dev one: it sits in the code path that
    # decides where money goes. Hand-rolling five special functions there is a
    # worse risk than the deployment size (REPLY_TO_AGENT.md §3).
    #
    # **Pinned to a minor range on purpose.** A quantile that moves in the sixth
    # decimal place can move a rounded bar, so the version is recorded in the
    # golden-snapshot metadata and an upgrade must be reviewed as a maths change.
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pip-audit>=2.7",
    # pip-audit pulls pip in transitively (via pip-api). Floor it past
    # PYSEC-2026-1721 (fixed in 26.2) so the audit doesn't flag its own tree.
    "pip>=26.2",
    # Property-based testing for the money invariants. The example-based tests
    # only cover the cases somebody thought of; `sum(payouts) + rake == pot`
    # has to hold for every pot, rake rate and winner count there is.
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymatch_api"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's `Depends()` in defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
markers = ["nodb: pure-function test, needs no database"]
asyncio_mode = "auto"
# One event loop for the whole session so the module-global async engine (and its
# asyncpg pool) is never used across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
