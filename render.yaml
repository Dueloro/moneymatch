# Render Blueprint. The web app is on Vercel (apps/web/vercel.json).
# Secrets live in the `moneymatch-shared` group; fill them in when the Blueprint is created.

databases:
  - name: moneymatch-postgres
    plan: 0.1c-256mb # paid, 256 MB / 0.1 CPU
    postgresMajorVersion: '16'
    region: ohio # match the Supabase project's region

services:
  - type: web
    name: moneymatch-api
    runtime: docker
    region: ohio # match the Supabase project's region
    plan: starter
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    # Runs once per deploy, before the new instance takes traffic; a failure aborts the deploy.
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    domains:
      - api.dueloro.com
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: moneymatch-postgres
          property: connectionString
      - fromGroup: moneymatch-shared

  - type: worker
    name: moneymatch-worker
    runtime: docker
    region: ohio # match the Supabase project's region
    plan: starter
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m moneymatch_api.workers.settlement_worker
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: moneymatch-postgres
          property: connectionString
      - fromGroup: moneymatch-shared

envVarGroups:
  - name: moneymatch-shared
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET # leave empty to verify via the project's JWKS
        sync: false
      - key: WEB_ORIGIN # exact Vercel origin, no trailing slash
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
