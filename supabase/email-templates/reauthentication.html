<div
  style="
    background: #f3f4f6;
    padding: 24px 0;
    font-family:
      system-ui,
      -apple-system,
      Segoe UI,
      Roboto,
      sans-serif;
  "
>
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
    "
  >
    <tr>
      <td style="background: #0b0b0c; padding: 20px 28px">
        <img
          src="https://play.dueloro.com/email/logo.png"
          width="28"
          height="28"
          alt="Money Match"
          style="vertical-align: middle; border-radius: 8px"
        />
        <span
          style="
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            vertical-align: middle;
            margin-left: 10px;
          "
          >Money Match</span
        >
      </td>
    </tr>
    <tr>
      <td style="padding: 28px; color: #111827">
        <h1 style="margin: 0 0 8px; font-size: 20px">Verify it's you</h1>
        <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.5; color: #374151">
          Enter this one-time code to continue with the security-sensitive change you
          requested.
        </p>
        <div
          style="
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #0b0b0c;
            background: #f3f7e6;
            border-radius: 12px;
            padding: 14px 0;
            text-align: center;
          "
        >
          {{ .Token }}
        </div>
        <p style="margin: 16px 0 0; font-size: 12px; color: #6b7280">
          Didn't request this? Do not share the code. Contact support@dueloro.com if
          you're concerned about your account.
        </p>
      </td>
    </tr>
    <tr>
      <td
        style="background: #0b0b0c; padding: 16px 28px; font-size: 12px; color: #9ca3af"
      >
        Money Match · account security notice
      </td>
    </tr>
  </table>
</div>
