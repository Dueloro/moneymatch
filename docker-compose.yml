# `make dev` uses only `db`; api/worker/web run on the host.
# `docker compose --profile full up` runs migrate, then api + worker, in containers.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moneymatch
      POSTGRES_PASSWORD: moneymatch
      POSTGRES_DB: moneymatch
    ports:
      # Override DB_PORT if 5432 is taken locally; keep DATABASE_URL's port in sync.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneymatch']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ['full']
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://moneymatch:moneymatch@db:5432/moneymatch
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ['full']
    build: *api-build
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '8000:8000'

  worker:
    profiles: ['full']
    build: *api-build
    env_file: .env
    environment: *api-env
    command: ['python', '-m', 'moneymatch_api.workers.settlement_worker']
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
